# Release executables: on a tag v<Version> (Directory.Build.props), test, build one self-contained
# file per system, pack it with the licenses, compute SHA-256 and prepare a DRAFT pre-release.
# Publishing the draft is a manual step on GitHub, so that nothing goes public by accident.
name: Release

on:
  push:
    tags: ['v*']
  # A pull request that changes the packaging builds the executables too, without a release.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'src/ScudoDigitale.Cli/ScudoDigitale.Cli.csproj'
      - 'THIRD-PARTY-NOTICES.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: Read and check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: read
        shell: bash
        run: |
          version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props)
          test -n "$version" || { echo "::error::No <Version> in Directory.Build.props"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the version ${version} (expected v${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  test:
    name: Test before packing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - run: dotnet build ScudoDigitale.sln -c Release
      - run: dotnet test --solution ScudoDigitale.sln -c Release --no-build

  publish:
    name: Executable (${{ matrix.rid }})
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          # macOS on macOS, each on its own processor: the SDK signs the executable (ad hoc) only
          # there, Apple Silicon refuses to run an unsigned one, and the smoke test runs natively.
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Publish one self-contained file
        run: dotnet publish src/ScudoDigitale.Cli -c Release -r ${{ matrix.rid }} -o out/scudo

      # The licenses of everything inside the executable: ours, the libraries (THIRD-PARTY-NOTICES),
      # the font, and the notices of the .NET runtime pack that publish actually used.
      - name: Add licenses
        shell: pwsh
        run: |
          Copy-Item LICENSE, NOTICE, THIRD-PARTY-NOTICES.txt, src/ScudoDigitale.Reporting/Fonts/DejaVu-LICENSE.txt out/scudo/
          $assets = Get-Content src/ScudoDigitale.Cli/obj/project.assets.json -Raw | ConvertFrom-Json
          $pack = $assets.project.frameworks.'net10.0'.downloadDependencies |
            Where-Object name -eq 'Microsoft.NETCore.App.Runtime.${{ matrix.rid }}'
          if (-not $pack) { throw 'Runtime pack not found in project.assets.json' }
          # The version is written as a range, "[10.0.15, 10.0.15]".
          $version = ($pack.version.Trim('[', ']') -split ',')[0].Trim()
          $packages = (dotnet nuget locals global-packages --list) -replace '^global-packages:\s*', ''
          $notices = Join-Path $packages "microsoft.netcore.app.runtime.${{ matrix.rid }}/$version/THIRD-PARTY-NOTICES.TXT"
          if (-not (Test-Path $notices)) { throw "Missing $notices" }
          Copy-Item $notices out/scudo/DOTNET-THIRD-PARTY-NOTICES.txt
          Write-Host ".NET runtime pack $version"

      # Runs the executable as a user would, without network: version, help, and a report from the
      # GDPR questionnaire, so that PDFsharp, its license and the embedded fonts are exercised too.
      - name: Smoke test
        shell: bash
        run: |
          exe=out/scudo/scudo; [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" scan --help > /dev/null
          echo '{}' > "$RUNNER_TEMP/answers.json"
          "$exe" scan --gdpr --answers "$RUNNER_TEMP/answers.json" --report "$RUNNER_TEMP/report" < /dev/null
          pdf=$(ls "$RUNNER_TEMP"/report/*.pdf)
          head -c 5 "$pdf" | grep -q '%PDF-' || { echo "::error::$pdf is not a PDF"; exit 1; }
          ls -l "$RUNNER_TEMP/report" out/scudo

      - name: Pack
        shell: bash
        run: |
          name="scudo-${{ needs.version.outputs.version }}-${{ matrix.rid }}"
          mkdir -p dist
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            (cd out && 7z a -tzip "../dist/${name}.zip" scudo > /dev/null)
          else
            chmod +x out/scudo/scudo
            tar -czf "dist/${name}.tar.gz" -C out scudo
          fi
          ls -l dist

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: package-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Draft pre-release
    needs: [version, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: SHA-256
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=docs/releases/v${{ needs.version.outputs.version }}.md
          test -f "$notes" || { echo "::error::Missing release notes $notes"; exit 1; }
          # A version with a suffix (0.1.0-beta) is a pre-release; 1.0.0 is not.
          prerelease=""; case "${{ needs.version.outputs.version }}" in *-*) prerelease="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft $prerelease \
            --title "Scudo Digitale ${{ needs.version.outputs.version }}" \
            --notes-file "$notes"
